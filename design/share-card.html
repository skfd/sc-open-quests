<!doctype html>
<!-- The site-wide share card, docs/img/share-card.png (1200x630, the og:image of every link).
     No number and no date, so it never goes stale. Render: python design/render_share_card.py
     The words sit inside the middle 630 px, so a square crop (WhatsApp, Slack) keeps them. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; position: relative; color: #fff;
         font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         background: linear-gradient(160deg, #4141ba, #3939a3); }
  .mid { position: absolute; left: 285px; width: 630px; top: 0; height: 630px; text-align: center; }
  .mid img { width: 132px; height: 132px; margin-top: 62px; }
  h1 { font-size: 78px; line-height: 1.05; font-weight: 700; margin: 26px 0 0; letter-spacing: -1px; }
  p { font-size: 33px; line-height: 1.3; margin: 26px 0 0; color: rgba(255, 255, 255, 0.88); }
  .foot { position: absolute; left: 0; right: 0; bottom: 34px; font-size: 22px; color: rgba(255, 255, 255, 0.7); }
  .pin { position: absolute; width: 104px; height: 104px; border-radius: 50%; background: #fff;
         box-shadow: 0 6px 18px rgba(0, 0, 0, 0.28); display: flex; align-items: center; justify-content: center; }
  .pin img { width: 84px; height: 84px; }
  .pin.s { width: 80px; height: 80px; opacity: 0.92; }
  .pin.s img { width: 64px; height: 64px; }
</style>
</head>
<body>
  <span class="pin" style="left:78px;top:92px"><img src="../docs/icons/housenumber.svg" alt=""></span>
  <span class="pin s" style="left:196px;top:300px"><img src="../docs/icons/bench_poi.svg" alt=""></span>
  <span class="pin" style="left:64px;top:446px"><img src="../docs/icons/bus_stop_shelter.svg" alt=""></span>
  <span class="pin s" style="left:936px;top:80px"><img src="../docs/icons/lantern.svg" alt=""></span>
  <span class="pin" style="left:1028px;top:262px"><img src="../docs/icons/street_surface.svg" alt=""></span>
  <span class="pin s" style="left:944px;top:470px"><img src="../docs/icons/opening_hours.svg" alt=""></span>
  <div class="mid">
    <img src="../docs/img/streetcomplete.svg" alt="">
    <h1>StreetComplete<br>open quests</h1>
    <p>by place and quest type,<br>over time</p>
    <div class="foot">counted daily from OpenStreetMap</div>
  </div>
</body>
</html>
